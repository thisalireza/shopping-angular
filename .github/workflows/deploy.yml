name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - main

# give the workflow explicit permission to write repository contents
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build -- --base-href "/shopping-angular/"

      - name: Show git info (for debugging)
        run: |
          echo "=== git version ==="
          git --version
          echo "=== remote info ==="
          git remote -v
          echo "=== branches ==="
          git branch -av
          echo "=== current user config ==="
          git config user.name || true
          git config user.email || true
          echo "=== ls dist (should contain index.html) ==="
          ls -la dist || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ github.sha }}"
          allow_empty_commit: true
          force_orphan: true    # ← مهم: اجازه ساخت شاخه‌ی جدید را می‌دهد

