<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <title>pb 360</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    .whitescreen-error {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 9999;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body class="sunny">
<div class="whitescreen-error" id="whitescreen-error">
  <h2>Error Loading Application</h2>
  <p id="error-message"></p>
</div>
  <app-root></app-root>
  <script>
    window.addEventListener('error', function(e) {
      const errorDiv = document.getElementById('whitescreen-error');
      const messageDiv = document.getElementById('error-message');
      errorDiv.style.display = 'block';
      messageDiv.textContent = e.message;
    });
  </script>
</body>
</html>
