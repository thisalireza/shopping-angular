<div class="py-5">
  <h5 class="fs-22 fw-bold text-center pb-3">مقلات تخصصی</h5>
  <div class="row row-cols-1 row-cols-md-3 g-4">
    @for (blog of articles; track blog; let i = $index) {
      <div class="col">
        <div class="card h-100 card-article">
          <img [src]="blog.imageURL" class="card-img-top" alt="blog"/>
          <div class="card-body">
            <h5 class="card-title fw-bold pb-2">{{ blog.title | truncate :45 }}</h5>
            <p class="card-text fs-14">
              {{ blog.description | truncate :100 }}
            </p>
          </div>
          <div class="card-footer d-flex justify-content-between">
            <div>
              <small class="text-muted fs-14">{{ blog.writer }}</small>
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   class="icon icon-tabler icons-tabler-outline icon-tabler-user-edit">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/>
                <path d="M6 21v-2a4 4 0 0 1 4 -4h3.5"/>
                <path d="M18.42 15.61a2.1 2.1 0 0 1 2.97 2.97l-3.39 3.42h-3v-3l3.42 -3.39z"/>
              </svg>
            </div>
            <div>
              <small class="text-muted fs-14">{{ blog.time }}
                <svg  xmlns="http://www.w3.org/2000/svg"  width="17"  height="17"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-clock-hour-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M12 12l3 2" /><path d="M12 7v5" /></svg>
              </small>

            </div>
          </div>
        </div>
      </div>

    }

  </div>
</div>
